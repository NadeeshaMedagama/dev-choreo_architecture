# ============================================================================
# DevChoreo Architecture — GitHub Action
# ============================================================================
# A composite GitHub Action that serves the DevChoreo system architecture
# diagram as a static HTML page using a lightweight Docker container.
# ============================================================================

name: "DevChoreo Architecture Diagram"
description: "Serve the DevChoreo system architecture diagram — an interactive HTML visualization of the AI-Powered RAG Assistant for WSO2 Choreo Platform."
author: "DevChoreo Team"

branding:
  icon: "layout"
  color: "blue"

# ──────────────────────────────────────────────────────────────
# Inputs
# ──────────────────────────────────────────────────────────────
inputs:
  port:
    description: "Port to serve the architecture diagram on"
    required: false
    default: "8080"

# ──────────────────────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────────────────────
outputs:
  url:
    description: "URL where the architecture diagram is served"
    value: ${{ steps.serve.outputs.url }}

# ──────────────────────────────────────────────────────────────
# Composite Steps
# ──────────────────────────────────────────────────────────────
runs:
  using: "composite"
  steps:
    - name: Verify architecture diagram exists
      shell: bash
      run: |
        if [ ! -f "${{ github.action_path }}/architecture-diagram.html" ]; then
          echo "❌ architecture-diagram.html not found"
          exit 1
        fi
        echo "✅ Architecture diagram found"

    - name: Serve architecture diagram
      id: serve
      shell: bash
      run: |
        PORT="${{ inputs.port }}"
        cd "${{ github.action_path }}"
        nohup python3 -m http.server ${PORT} &
        echo "url=http://localhost:${PORT}/architecture-diagram.html" >> $GITHUB_OUTPUT
        echo "✅ Architecture diagram served at http://localhost:${PORT}/architecture-diagram.html"

    - name: Action summary
      shell: bash
      if: always()
      run: |
        echo "## 🏗️ DevChoreo Architecture Diagram" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **URL** | \`http://localhost:${{ inputs.port }}/architecture-diagram.html\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Port** | \`${{ inputs.port }}\` |" >> $GITHUB_STEP_SUMMARY

