# ============================================================================
# DevChoreo — CI/CD Pipeline
# ============================================================================
# Runs linting, testing, and building for both backend (FastAPI/Python) and
# frontend (React/Vite) on every push and pull request to main/develop.
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_DEFAULT: "3.12"
  NODE_DEFAULT: "20"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Backend — Lint, Test, Coverage
  # ──────────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend Lint (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

  backend-test:
    name: "Backend Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ]; then
            pytest tests/ \
              --cov=. \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov \
              --cov-report=term-missing \
              -v --tb=short
          else
            echo "⏭️ No tests/ directory found, skipping tests"
            echo "## ⚠️ No tests found" >> $GITHUB_STEP_SUMMARY
            echo "The \`tests/\` directory does not exist yet." >> $GITHUB_STEP_SUMMARY
          fi
        env:
          APP_ENV: testing

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Frontend — Lint, Build
  # ──────────────────────────────────────────────────────────────
  frontend-lint:
    name: "Frontend Lint (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend directory
        id: check-frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ No frontend/ directory found, skipping lint" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npx eslint . --max-warnings=0

  frontend-build:
    name: "Frontend Build (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    needs: frontend-lint
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend directory
        id: check-frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ No frontend/ directory found, skipping build" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        if: matrix.node-version == '20' && steps.check-frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Deploy Gate — Ensures all checks pass
  # ──────────────────────────────────────────────────────────────
  deploy-gate:
    name: "Deploy Gate"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "## ✅ Deploy Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Build:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image:** ✅ Built" >> $GITHUB_STEP_SUMMARY

