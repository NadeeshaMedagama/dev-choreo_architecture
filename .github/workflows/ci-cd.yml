# ============================================================================
# DevChoreo Architecture — CI/CD Pipeline
# ============================================================================
# Validates the architecture diagram HTML file and builds the Docker image.
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Validate HTML
  # ──────────────────────────────────────────────────────────────
  validate-html:
    name: "Validate HTML"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check architecture diagram exists
        run: |
          if [ ! -f "architecture-diagram.html" ]; then
            echo "❌ architecture-diagram.html not found"
            exit 1
          fi
          echo "✅ architecture-diagram.html found"

      - name: Validate HTML structure
        run: |
          echo "🔍 Validating HTML file..."

          # Check for required content
          if grep -q "DevChoreo" architecture-diagram.html; then
            echo "✅ Contains DevChoreo title"
          else
            echo "❌ Missing DevChoreo title"
            exit 1
          fi

          if grep -q "<!DOCTYPE html>" architecture-diagram.html; then
            echo "✅ Valid HTML5 doctype"
          else
            echo "❌ Missing HTML5 doctype"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s architecture-diagram.html)
          echo "📄 File size: ${FILE_SIZE} bytes"

          echo ""
          echo "✅ HTML validation passed!"

      - name: Validation summary
        run: |
          echo "## ✅ HTML Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| File exists | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML5 doctype | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Content check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Docker Build
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: validate-html
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devchoreo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container serves HTML
        run: |
          docker run -d --name test-container -p 8080:80 devchoreo:test
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Container serves HTML correctly (HTTP $STATUS)"
          else
            echo "❌ Container health check failed (HTTP $STATUS)"
            docker logs test-container
            exit 1
          fi
          docker stop test-container && docker rm test-container

      - name: Build summary
        run: |
          echo "## 🐳 Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image built | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Container test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
