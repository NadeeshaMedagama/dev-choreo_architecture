# ============================================================================
# DevChoreo — CodeQL Security Analysis
# ============================================================================
# Performs automated security vulnerability scanning using GitHub CodeQL
# for JavaScript/TypeScript codebases.
# ============================================================================

name: CodeQL Security Analysis

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Detect source code languages
  # ──────────────────────────────────────────────────────────────
  detect-languages:
    name: "Detect Languages"
    runs-on: ubuntu-latest
    outputs:
      has-javascript: ${{ steps.detect.outputs.has_javascript }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect source code
        id: detect
        run: |
          # Check for JavaScript/TypeScript source files
          if find . -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) \
            -not -path "*/node_modules/*" -not -path "*/.venv/*" | grep -q .; then
            echo "has_javascript=true" >> $GITHUB_OUTPUT
            echo "✅ JavaScript/TypeScript source code detected"
          else
            echo "has_javascript=false" >> $GITHUB_OUTPUT
            echo "⏭️ No JavaScript/TypeScript source code found"
          fi

  # ──────────────────────────────────────────────────────────────
  # CodeQL Analysis — JavaScript/TypeScript
  # ──────────────────────────────────────────────────────────────
  analyze-javascript:
    name: "CodeQL Analysis (JavaScript/TypeScript)"
    runs-on: ubuntu-latest
    needs: detect-languages
    if: needs.detect-languages.outputs.has-javascript == 'true'
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ──────────────────────────────────────────────────────────────
  # Security Summary
  # ──────────────────────────────────────────────────────────────
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [detect-languages, analyze-javascript]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 CodeQL Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.detect-languages.outputs.has-javascript }}" = "true" ]; then
            echo "| JavaScript/TypeScript | ${{ needs.analyze-javascript.result == 'success' && '✅ Passed' || '❌ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JavaScript/TypeScript | ⏭️ Skipped (no source code) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 View detailed results in the **Security** tab of this repository." >> $GITHUB_STEP_SUMMARY

