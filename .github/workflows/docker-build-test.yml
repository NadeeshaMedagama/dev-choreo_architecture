# ============================================================================
# DevChoreo — Docker Build & Test
# ============================================================================
# Builds Docker images and runs container health checks to ensure the
# application starts correctly and all endpoints are reachable.
# ============================================================================

name: Docker Build & Test

on:
  push:
    branches: [master, develop]
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "requirements*.txt"
      - ".dockerignore"
      - "**.py"
  pull_request:
    branches: [master, develop]
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "requirements*.txt"
      - ".dockerignore"
      - "**.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devchoreo
  IMAGE_NAME: devchoreo
  HEALTH_CHECK_URL: http://localhost:8000/api/health
  HEALTH_CHECK_TIMEOUT: 120

jobs:
  # ──────────────────────────────────────────────────────────────
  # Docker Build
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') }}
          load: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE_NAME }}:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Inspect image
        run: |
          docker images
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Image Built & Pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub Image** | \`${{ env.DOCKERHUB_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && '✅ Yes' || '⏭️ Skipped (PR)' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Save Docker image for testing
        run: docker save ${{ env.IMAGE_NAME }}:local -o /tmp/docker-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Container Health Check
  # ──────────────────────────────────────────────────────────────
  container-health-check:
    name: "Container Health Check"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Start container
        run: |
          docker run -d \
            --name devchoreo-test \
            -p 8000:8000 \
            -e APP_ENV=testing \
            -e AZURE_OPENAI_API_KEY=test-key \
            -e AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/ \
            -e MILVUS_URI=https://test.zillizcloud.com \
            -e MILVUS_TOKEN=test-token \
            ${{ env.IMAGE_NAME }}:local

      - name: Wait for health check
        run: |
          echo "⏳ Waiting for container to be healthy..."
          SECONDS=0
          until curl -sf ${{ env.HEALTH_CHECK_URL }} > /dev/null 2>&1; do
            if [ $SECONDS -ge ${{ env.HEALTH_CHECK_TIMEOUT }} ]; then
              echo "❌ Health check timed out after ${{ env.HEALTH_CHECK_TIMEOUT }}s"
              echo "Container logs:"
              docker logs devchoreo-test
              exit 1
            fi
            echo "  Waiting... (${SECONDS}s elapsed)"
            sleep 5
          done
          echo "✅ Container is healthy after ${SECONDS}s"

      - name: Verify endpoints
        run: |
          echo "🔍 Verifying API endpoints..."

          # Health endpoint
          echo -n "  /api/health: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_CHECK_URL }})
          if [ "$STATUS" = "200" ]; then echo "✅ $STATUS"; else echo "❌ $STATUS"; exit 1; fi

          # Metrics endpoint
          echo -n "  /metrics: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/metrics)
          if [ "$STATUS" = "200" ]; then echo "✅ $STATUS"; else echo "❌ $STATUS"; exit 1; fi

          echo ""
          echo "✅ All endpoint checks passed!"

      - name: Container resource usage
        run: docker stats devchoreo-test --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}"

      - name: Cleanup
        if: always()
        run: |
          docker logs devchoreo-test > /tmp/container-logs.txt 2>&1 || true
          docker stop devchoreo-test || true
          docker rm devchoreo-test || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: /tmp/container-logs.txt
          retention-days: 7

      - name: Health check summary
        run: |
          echo "## 🏥 Container Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`/api/health\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| \`/metrics\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Docker Compose Integration Test
  # ──────────────────────────────────────────────────────────────
  docker-compose-test:
    name: "Docker Compose Test"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for docker-compose file
        id: check-compose
        run: |
          if ls docker-compose*.yml 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ No docker-compose file found, skipping test" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create test .env file
        if: steps.check-compose.outputs.exists == 'true'
        run: |
          cat > .env << 'EOF'
          APP_ENV=testing
          AZURE_OPENAI_API_KEY=test-key
          AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/
          AZURE_OPENAI_DEPLOYMENT_NAME=gpt-4
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-ada-002
          MILVUS_URI=https://test.zillizcloud.com
          MILVUS_TOKEN=test-token
          GITHUB_TOKEN=test-token
          LOG_LEVEL=INFO
          EOF

      - name: Start services with Docker Compose
        if: steps.check-compose.outputs.exists == 'true'
        run: docker compose up -d --build

      - name: Wait for services
        if: steps.check-compose.outputs.exists == 'true'
        run: |
          echo "⏳ Waiting for services to start..."
          SECONDS=0
          until curl -sf http://localhost:8000/api/health > /dev/null 2>&1; do
            if [ $SECONDS -ge ${{ env.HEALTH_CHECK_TIMEOUT }} ]; then
              echo "❌ Services failed to start"
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          echo "✅ All services are running after ${SECONDS}s"

      - name: Run integration checks
        if: steps.check-compose.outputs.exists == 'true'
        run: |
          echo "🔍 Running integration checks..."
          curl -sf http://localhost:8000/api/health | python3 -m json.tool
          echo "✅ Integration checks passed!"

      - name: Cleanup
        if: always() && steps.check-compose.outputs.exists == 'true'
        run: |
          docker compose logs > /tmp/compose-logs.txt 2>&1 || true
          docker compose down -v || true

      - name: Upload compose logs
        if: always() && steps.check-compose.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: /tmp/compose-logs.txt
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Security Scan — Trivy
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: "Container Security Scan"
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:local
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:local
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

