# ============================================================================
# DevChoreo Architecture — Docker Build & Test
# ============================================================================
# Builds Docker images and runs container health checks to ensure the
# architecture diagram is served correctly.
# ============================================================================

name: Docker Build & Test

on:
  push:
    branches: [master, develop]
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "architecture-diagram.html"
      - ".dockerignore"
  pull_request:
    branches: [master, develop]
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "architecture-diagram.html"
      - ".dockerignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devchoreo
  IMAGE_NAME: devchoreo
  HEALTH_CHECK_URL: http://localhost:80
  HEALTH_CHECK_TIMEOUT: 60

jobs:
  # ──────────────────────────────────────────────────────────────
  # Docker Build
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        run: |
          echo '${{ steps.meta.outputs.tags }}' | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "🏷️ Tagging and pushing: $TAG"
            docker tag ${{ env.IMAGE_NAME }}:local "$TAG"
            docker push "$TAG"
          done

      - name: Inspect image
        run: |
          docker images
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub Image** | \`${{ env.DOCKERHUB_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && '✅ Yes' || '⏭️ Skipped (PR)' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Save Docker image for testing
        run: docker save ${{ env.IMAGE_NAME }}:local -o /tmp/docker-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Container Health Check
  # ──────────────────────────────────────────────────────────────
  container-health-check:
    name: "Container Health Check"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Start container
        run: |
          docker run -d \
            --name devchoreo-test \
            -p 80:80 \
            ${{ env.IMAGE_NAME }}:local

      - name: Wait for health check
        run: |
          echo "⏳ Waiting for container to be healthy..."
          SECONDS=0
          until curl -sf ${{ env.HEALTH_CHECK_URL }} > /dev/null 2>&1; do
            if [ $SECONDS -ge ${{ env.HEALTH_CHECK_TIMEOUT }} ]; then
              echo "❌ Health check timed out after ${{ env.HEALTH_CHECK_TIMEOUT }}s"
              echo "Container logs:"
              docker logs devchoreo-test
              exit 1
            fi
            echo "  Waiting... (${SECONDS}s elapsed)"
            sleep 3
          done
          echo "✅ Container is healthy after ${SECONDS}s"

      - name: Verify HTML is served
        run: |
          echo "🔍 Verifying architecture diagram is served..."

          # Check root serves the HTML
          echo -n "  / (architecture diagram): "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_CHECK_URL }})
          if [ "$STATUS" = "200" ]; then echo "✅ $STATUS"; else echo "❌ $STATUS"; exit 1; fi

          # Verify content contains expected title
          echo -n "  Content check: "
          if curl -s ${{ env.HEALTH_CHECK_URL }} | grep -q "DevChoreo"; then
            echo "✅ Architecture diagram content verified"
          else
            echo "❌ Expected content not found"
            exit 1
          fi

          echo ""
          echo "✅ All checks passed!"

      - name: Container resource usage
        run: docker stats devchoreo-test --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}"

      - name: Cleanup
        if: always()
        run: |
          docker logs devchoreo-test > /tmp/container-logs.txt 2>&1 || true
          docker stop devchoreo-test || true
          docker rm devchoreo-test || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: /tmp/container-logs.txt
          retention-days: 7

      - name: Health check summary
        run: |
          echo "## 🏥 Container Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML served at \`/\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Content verification | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Security Scan — Trivy
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: "Container Security Scan"
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:local
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:local
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

